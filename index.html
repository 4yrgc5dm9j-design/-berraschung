<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dailybase</title>
    <meta name="description" content="Deine persönliche Alltagszentrale: Heute, News, Börse, Sport, Sammlungen und Planung." />
    <meta name="theme-color" content="#0c0e13" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dailybase" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Theme vor dem ersten Rendern setzen, damit nichts aufblitzt.
      try {
        var t = localStorage.getItem('dailybase-theme') || 'system'
        var a = localStorage.getItem('dailybase-accent') || 'ozean'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.dataset.accent = a
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
