# Baut die Web-Version bei jedem Push auf master und veröffentlicht sie
# im Branch gh-pages (GitHub Pages → https://<user>.github.io/<repository>/).
# Zusätzlich alle 30 Minuten: News-Feeds und Sportdaten neu abrufen, damit die
# Web-Version ohne eigenen Server aktuelle Nachrichten zeigt.
name: Web-Version veröffentlichen

on:
  push:
    branches: [master]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        if: github.event_name != 'schedule'
      - run: npm run build:pages
        env:
          DAILYBASE_BASE: /${{ github.event.repository.name }}/
      - name: News & Sportdaten abrufen
        run: node scripts/fetch-data.mjs dist/data
      - name: In gh-pages veröffentlichen
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web-Version ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
